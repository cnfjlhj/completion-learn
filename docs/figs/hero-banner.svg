<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0c27f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f0c27f" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7ec8a8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7ec8a8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7ba7d0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7ba7d0" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1060" cy="60" r="220" fill="#f0c27f" fill-opacity="0.03"/>
  <circle cx="120" cy="340" r="180" fill="#7ec8a8" fill-opacity="0.03"/>
  <circle cx="600" cy="-40" r="300" fill="#7ba7d0" fill-opacity="0.02"/>

  <!-- Title -->
  <text x="72" y="100" fill="#e8e6e3" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" letter-spacing="-0.5">completion-learn</text>

  <!-- Subtitle -->
  <text x="74" y="138" fill="#8b8da0" font-family="'Segoe UI', Arial, sans-serif" font-size="20">Turn finished tasks into lasting growth — self first, tools last.</text>

  <!-- Card 1: Self -->
  <rect x="72" y="180" width="330" height="130" rx="12" fill="url(#gold)" stroke="#f0c27f" stroke-opacity="0.25" stroke-width="1"/>
  <text x="92" y="216" fill="#f0c27f" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">01</text>
  <text x="122" y="216" fill="#e8e6e3" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Self</text>
  <text x="92" y="248" fill="#a0a0b0" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Keep · Stop · Practice · Rule</text>
  <text x="92" y="278" fill="#6a6a7a" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Reclaim your attention and judgment</text>
  <text x="92" y="296" fill="#6a6a7a" font-family="'Segoe UI', Arial, sans-serif" font-size="13">before reaching for more tools.</text>

  <!-- Arrow 1 -->
  <line x1="414" y1="245" x2="432" y2="245" stroke="#505070" stroke-width="1.5"/>
  <polygon points="432,240 444,245 432,250" fill="#505070"/>

  <!-- Card 2: Collaboration -->
  <rect x="456" y="180" width="330" height="130" rx="12" fill="url(#green)" stroke="#7ec8a8" stroke-opacity="0.25" stroke-width="1"/>
  <text x="476" y="216" fill="#7ec8a8" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">02</text>
  <text x="506" y="216" fill="#e8e6e3" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Collaboration</text>
  <text x="476" y="248" fill="#a0a0b0" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Pattern · Clarity · Ownership</text>
  <text x="476" y="278" fill="#6a6a7a" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Stabilize the human-tool loop.</text>
  <text x="476" y="296" fill="#6a6a7a" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Clarify earlier, split ownership better.</text>

  <!-- Arrow 2 -->
  <line x1="798" y1="245" x2="816" y2="245" stroke="#505070" stroke-width="1.5"/>
  <polygon points="816,240 828,245 816,250" fill="#505070"/>

  <!-- Card 3: Tool -->
  <rect x="840" y="180" width="290" height="130" rx="12" fill="url(#blue)" stroke="#7ba7d0" stroke-opacity="0.25" stroke-width="1"/>
  <text x="860" y="216" fill="#7ba7d0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">03</text>
  <text x="890" y="216" fill="#e8e6e3" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Tool</text>
  <text x="860" y="248" fill="#a0a0b0" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Sediment · Optimize · Route</text>
  <text x="860" y="278" fill="#6a6a7a" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Evolve only what truly repeats.</text>
  <text x="860" y="296" fill="#6a6a7a" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Optimize before creating anew.</text>

  <!-- Bottom tagline -->
  <text x="72" y="355" fill="#4a4a5a" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">Completion is not the end — it is the entry point to the learning loop.</text>
</svg>
